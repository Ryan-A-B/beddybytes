name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - "scripts/android/**"
      - ".github/workflows/android.yml"
  push:
    branches:
      - master
    paths:
      - "android/**"
      - "scripts/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run canonical Android checks
        run: ./scripts/android/check.sh

      - name: Build local debug APK
        run: ./scripts/android/build-debug.sh
